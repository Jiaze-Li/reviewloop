name: PR7 repair verification (one time)

on:
  push:
    branches: [vnext-contract-evidence-resume]
    paths: [.github/workflows/pr7-repair-once.yml]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: pr7-repair-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 50
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # A hash-pinned, locally authored patch and regression suite, compressed
      # only for transport. The decoded patch is uploaded for inspection.
      # This job NEVER updates a Git reference, creates a PR, or merges.
      - name: Apply exact-source repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Jiaze-Li/reviewloop
          test "$GITHUB_REF" = refs/heads/vnext-contract-evidence-resume
          git merge-base --is-ancestor 30b686a9c6b88b93b8c71cbee3802ec8cc557ff7 HEAD
          git diff --exit-code 30b686a9c6b88b93b8c71cbee3802ec8cc557ff7 HEAD -- src tests README.md
          python3 - <<'PY'
          import base64, hashlib, pathlib, zlib
          encoded = ''''''
          patch = zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '2ece39774a73356ef9f36da01c180c1166ad75f792e886ffea75db773825f259', 'repair transport hash mismatch'
          pathlib.Path('/tmp/pr7-repair.py').write_bytes(patch)
          exec(compile(patch, '/tmp/pr7-repair.py', 'exec'))
          PY
          git diff --check
          git diff --stat
      - name: Install exact lockfile
        run: npm ci
      - name: Full deterministic suite
        run: npm test
      - name: Full doctor
        run: npm run doctor
      - name: Preserve inspectable candidate source
        uses: actions/upload-artifact@v4
        with:
          name: pr7-tested-source
          path: |
            src/reviewloop/contractEvidence.js
            src/reviewloop/controller.js
            src/reviewloop/providerWiring.js
            src/mcp/reviewloopMcpServer.js
            tests/reviewLoopEvidenceRecovery.test.js
            tests/reviewLoopGateEvidenceSafety.test.js
            README.md
          retention-days: 3
      - name: Create tested candidate objects without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, urllib.request
          repo = 'Jiaze-Li/reviewloop'
          old = '30b686a9c6b88b93b8c71cbee3802ec8cc557ff7'
          def api(endpoint, body=None):
              req = urllib.request.Request('https://api.github.com/repos/'+repo+'/'+endpoint, data=None if body is None else json.dumps(body).encode(), headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'}, method='GET' if body is None else 'POST')
              with urllib.request.urlopen(req, timeout=30) as response: return json.load(response)
          head = os.environ['GITHUB_SHA']
          pr = api('pulls/7')
          assert pr['state']=='open' and pr['head']['sha']==head and pr['head']['ref']=='vnext-contract-evidence-resume'
          paths = ['src/reviewloop/contractEvidence.js','src/reviewloop/controller.js','src/reviewloop/providerWiring.js','src/mcp/reviewloopMcpServer.js','tests/reviewLoopEvidenceRecovery.test.js','tests/reviewLoopGateEvidenceSafety.test.js','README.md']
          entries = [{'path':p,'mode':'100644','type':'blob','content':pathlib.Path(p).read_text()} for p in paths]
          base_tree = subprocess.check_output(['git','rev-parse',old+'^{tree}'],text=True).strip()
          tree = api('git/trees',{'base_tree':base_tree,'tree':entries})['sha']
          commit = api('git/commits',{'message':'fix: keep gate evidence snapshot-safe and bound contract recovery\n\nInvalidate pre-Gate proof on LOCAL mutations, preflight invalid PR evidence before worktree spend, acknowledge Gate-FAIL submissions, narrow phase inference, bound frozen contracts and retain one latest proof per requirement. Preserve frozen phase proof chains and exact-code/scope semantics. Full deterministic tests and doctor passed before creating this candidate; temporary verification files are absent from its tree.','tree':tree,'parents':[head]})['sha']
          print('CANDIDATE_COMMIT='+commit)
          print('CANDIDATE_TREE='+tree)
          print('No Git references updated; no merge performed.')
          PY
